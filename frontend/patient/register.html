<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Patient Registration - MediConnect">
    <title>Patient Registration - MediConnect</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body class="login-page">
    <div class="login-card">
        <!-- Back to Home -->
        <a href="/index.html"
            style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--gray-600); font-weight: 500; font-size: 14px; margin-bottom: var(--space-6); transition: color 0.3s ease;"
            onmouseover="this.style.color='var(--primary-600)'" onmouseout="this.style.color='var(--gray-600)'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Back to Home
        </a>

        <!-- Logo -->
        <div class="logo" style="justify-content: center; margin-bottom: var(--space-4);">
            <div class="logo-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path
                        d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
            </div>
            <span class="logo-text">Medi<span class="logo-highlight">Connect</span></span>
        </div>

        <!-- STEP 1: EMAIL -->
        <div id="registerForm">
            <h2 class="portal-title">Create Account</h2>
            <p class="portal-subtitle">Join MediConnect to book appointments and track your health.</p>
            
            <form onsubmit="handleRegisterEmail(event)">
                <div class="form-group">
                    <label class="form-label">Email Address <span class="required">*</span></label>
                    <div class="form-input-icon">
                        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                            <polyline points="22,6 12,13 2,6" />
                        </svg>
                        <input type="email" id="regEmail" class="form-input" placeholder="you@email.com" required>
                    </div>
                </div>
                <div id="registerError" class="alert alert-error" style="display:none; margin-bottom:var(--space-4);">
                </div>
                <div style="display: flex; flex-direction: column; gap: var(--space-3);">
                    <button type="submit" id="registerBtn" class="btn btn-primary btn-block">Get OTP</button>
                    <a href="/index.html" class="btn btn-primary btn-block">Cancel</a>
                </div>
            </form>
            <p style="text-align:center; margin-top: var(--space-4); font-size:0.85rem; color: var(--neutral-500);">
                Already have an account? <a href="/patient/login.html"
                    style="color:var(--primary-600); font-weight:600;">Sign in</a>
            </p>
        </div>

        <!-- STEP 2: OTP -->
        <div id="otpForm" style="display:none;">
            <div style="text-align:center; margin-bottom: var(--space-6);">
                <div
                    style="width:64px;height:64px; background:var(--primary-50); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto var(--space-4);">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--primary-600)"
                        stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                        <polyline points="22,6 12,13 2,6" />
                    </svg>
                </div>
                <h2 style="font-size:1.15rem; font-weight:700; color:var(--neutral-800);">Check your email!</h2>
                <p style="color:var(--neutral-500); font-size:0.875rem; margin-top:var(--space-2);">We sent a 6-digit
                    OTP to <strong id="otpEmailDisplay"></strong></p>
            </div>
            <div class="form-group">
                <label class="form-label" style="text-align:center; display:block;">Enter OTP</label>
                <input type="text" id="otpInput" class="form-input" placeholder="000000" maxlength="6"
                    style="text-align:center; font-size:1.8rem; font-weight:700; letter-spacing:8px;" required>
            </div>
            <div id="otpError" class="alert alert-error" style="display:none; margin-bottom:var(--space-4);"></div>
            <button onclick="handleVerifyOtp()" id="verifyBtn" class="btn btn-primary btn-block">Verify OTP</button>
            <div style="text-align:center; margin-top: var(--space-4);">
                <button onclick="resendOtp()"
                    style="background:none; border:none; color:var(--primary-600); font-weight:600; cursor:pointer; font-size:0.9rem;">Didn't
                    receive? Resend OTP</button>
            </div>
        </div>

        <!-- STEP 3: DETAILS -->
        <div id="registerDetailsForm" style="display:none;">
            <h2 class="portal-title">Complete Registration</h2>
            <p class="portal-subtitle">Your email is verified. Please complete your profile.</p>
            
            <form onsubmit="handleRegisterDetails(event)">
                <div class="form-group">
                    <label class="form-label">Full Name <span class="required">*</span></label>
                    <input type="text" id="regName" class="form-input" placeholder="Your full name" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Phone Number <span class="required">*</span></label>
                    <input type="tel" id="regPhone" class="form-input" placeholder="+91 98765 43210" required>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap: var(--space-4);">
                    <div class="form-group">
                        <label class="form-label">Gender</label>
                        <select id="regGender" class="form-select">
                            <option value="">Select</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Blood Group</label>
                        <select id="regBlood" class="form-select">
                            <option value="">Select</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Password <span class="required">*</span></label>
                    <input type="password" id="regPassword" class="form-input" placeholder="Minimum 6 characters"
                        minlength="6" required>
                </div>
                <div id="registerDetailsError" class="alert alert-error"
                    style="display:none; margin-bottom:var(--space-4);"></div>
                <button type="submit" id="registerDetailsBtn" class="btn btn-primary btn-block">Create Account</button>
            </form>
        </div>
    </div>

    <script src="/script.js"></script>
    <script>
        let currentEmail = '';

        async function handleRegisterEmail(e) {
            e.preventDefault();
            const btn = document.getElementById('registerBtn');
            const errEl = document.getElementById('registerError');
            const email = document.getElementById('regEmail').value;
            errEl.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Sending OTP...';

            try {
                const res = await fetch('/api/patients/send-register-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                if (!res.ok) {
                    errEl.textContent = data.error;
                    errEl.style.display = 'block';
                    return;
                }
                currentEmail = email;
                showToast('OTP sent to your email!', 'success');
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('otpForm').style.display = 'block';
                document.getElementById('otpEmailDisplay').textContent = email;
                document.getElementById('otpInput').focus();
            } catch (err) {
                errEl.textContent = 'Connection error. Please try again.';
                errEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Get OTP';
            }
        }

        async function handleVerifyOtp() {
            const btn = document.getElementById('verifyBtn');
            const errEl = document.getElementById('otpError');
            const otp = document.getElementById('otpInput').value.trim();
            errEl.style.display = 'none';

            if (!otp || otp.length !== 6) {
                errEl.textContent = 'Please enter the 6-digit OTP.';
                errEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Verifying...';

            try {
                const res = await fetch('/api/patients/verify-register-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, otp })
                });
                const data = await res.json();
                if (!res.ok) {
                    errEl.textContent = data.error;
                    errEl.style.display = 'block';
                    return;
                }
                showToast('Email verified!', 'success');
                document.getElementById('otpForm').style.display = 'none';
                document.getElementById('registerDetailsForm').style.display = 'block';
            } catch (err) {
                errEl.textContent = 'Connection error. Please try again.';
                errEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Verify OTP';
            }
        }

        async function handleRegisterDetails(e) {
            e.preventDefault();
            const btn = document.getElementById('registerDetailsBtn');
            const errEl = document.getElementById('registerDetailsError');
            errEl.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Creating Account...';

            try {
                const res = await fetch('/api/patients/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        full_name: document.getElementById('regName').value,
                        email: currentEmail,
                        phone: document.getElementById('regPhone').value,
                        gender: document.getElementById('regGender').value,
                        blood_group: document.getElementById('regBlood').value,
                        password: document.getElementById('regPassword').value
                    })
                });
                const data = await res.json();
                if (!res.ok) {
                    errEl.textContent = data.error;
                    errEl.style.display = 'block';
                    return;
                }
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                showToast('Account created successfully!', 'success');
                setTimeout(() => window.location.href = '/patient/dashboard.html', 800);
            } catch (err) {
                errEl.textContent = 'Connection error. Please try again.';
                errEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        }

        async function resendOtp() {
            try {
                await fetch('/api/patients/resend-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail })
                });
                showToast('New OTP sent to your email!', 'success');
                document.getElementById('otpInput').value = '';
            } catch (err) {
                showToast('Failed to resend OTP.', 'error');
            }
        }
    </script>
</body>

</html>
