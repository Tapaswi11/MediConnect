<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Medical History - Patient Portal - MediConnect">
    <title>Medical History - Patient Portal - MediConnect</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .timeline { position: relative; padding-left: 30px; }
        .timeline::before { content: ''; position: absolute; left: 10px; top: 0; bottom: 0; width: 2px; background: var(--neutral-200); }
        .timeline-item { position: relative; margin-bottom: var(--space-8); }
        .timeline-item::before { content: ''; position: absolute; left: -25px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--primary-500); border: 2px solid white; box-shadow: 0 0 0 2px var(--primary-100); }
        .history-card { background: white; border-radius: var(--radius-lg); border: 1px solid var(--neutral-200); padding: var(--space-6); transition: transform 0.2s; }
        .history-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="dashboard-sidebar" id="patientSidebar">
            <div class="sidebar-logo">
                <div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
                <span class="logo-text">Medi<span style="color:var(--primary-300);">Connect</span></span>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-section-title">Main</div>
                <a href="/index.html" class="sidebar-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Back to Home
                </a>
                <a href="/patient/dashboard.html" class="sidebar-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    Dashboard
                </a>
                <a href="/patient/appointments.html" class="sidebar-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    Check Appointments
                </a>
                <a href="/patient/appointment.html" class="sidebar-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                    Book Appointment
                </a>
                <a href="/patient/medical-history.html" class="sidebar-link active">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    Medical History
                </a>
                <div class="sidebar-section-title">Account</div>
                <a href="/patient/profile.html" class="sidebar-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    My Profile
                </a>
                <a href="#" class="sidebar-link" onclick="logout()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Logout
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-user-avatar" id="sidebarAvatar">PT</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="sidebarName">Patient</div>
                        <div class="sidebar-user-role">Patient</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">
            <button class="sidebar-toggle-btn" onclick="document.getElementById('patientSidebar').classList.toggle('open')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>

            <div class="dashboard-header">
                <div>
                    <h1 class="dashboard-title">Medical History</h1>
                    <p class="dashboard-subtitle">View your past diagnoses and prescriptions.</p>
                </div>
            </div>

            <!-- History Timeline -->
            <div id="historyTimeline" class="hidden">
                <div class="timeline" id="timelineList">
                    <!-- History items will be injected here -->
                </div>
            </div>

            <div id="noHistory" class="hidden" style="text-align: center; padding: var(--space-16);">
                <div style="background: var(--neutral-50); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-4);">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--neutral-400)" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                </div>
                <h3 style="color: var(--neutral-800); margin-bottom: var(--space-2);">No records found</h3>
                <p style="color: var(--neutral-500);">You don't have any completed medical records yet.</p>
                <a href="/patient/appointment.html" class="btn btn-primary btn-sm" style="margin-top: var(--space-4);">Book an Appointment</a>
            </div>
        </main>
    </div>

    <script src="/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = getUser();
            if (!user || user.role !== 'patient') {
                window.location.href = '/patient/login.html';
                return;
            }
            document.getElementById('sidebarName').textContent = user.full_name;
            document.getElementById('sidebarAvatar').textContent = getInitials(user.full_name);
            initDashboardSidebar();
            
            // Auto-fetch history for logged-in user
            fetchHistory(user.email, user.full_name);
        });

        async function fetchHistory(email, name) {
            try {
                const data = await apiGet(`/appointments/patient/history?email=${encodeURIComponent(email)}&patientName=${encodeURIComponent(name)}`);
                const history = data.history || [];
                
                if (history.length === 0) {
                    document.getElementById('noHistory').classList.remove('hidden');
                    document.getElementById('historyTimeline').classList.add('hidden');
                } else {
                    renderTimeline(history);
                    document.getElementById('historyTimeline').classList.remove('hidden');
                    document.getElementById('noHistory').classList.add('hidden');
                }
            } catch (error) {
                showToast(error.message || 'Failed to fetch history', 'error');
            }
        }

        function renderTimeline(history) {
            const list = document.getElementById('timelineList');
            list.innerHTML = history.map(item => `
                <div class="timeline-item">
                    <div class="history-card">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--space-3);">
                            <div>
                                <span style="font-weight: 800; color: var(--primary-600);">${formatDate(item.appointment_date)}</span>
                                <div style="font-size: 0.9rem; color: var(--neutral-500);">${item.time_slot}</div>
                            </div>
                            <div class="badge" style="background: var(--success-50); color: var(--success-700); border-color: var(--success-200);">Completed</div>
                        </div>
                        <h3 style="font-size: 1.1rem; margin-bottom: var(--space-2);">Dr. ${item.doctor_name}</h3>
                        <p style="color: var(--neutral-600); font-size: 0.9rem; margin-bottom: var(--space-4);">${item.specialization_name}</p>
                        
                        <div style="background: var(--neutral-50); padding: var(--space-4); border-radius: var(--radius-md); margin-bottom: var(--space-4);">
                            <h4 style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--neutral-400); margin-bottom: var(--space-2);">Diagnosis</h4>
                            <p style="color: var(--neutral-800);">${item.diagnosis || 'No diagnosis recorded'}</p>
                        </div>

                        ${item.prescription ? `
                        <div style="background: var(--primary-50); padding: var(--space-4); border-radius: var(--radius-md); border: 1px dashed var(--primary-200);">
                            <h4 style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--primary-600); margin-bottom: var(--space-2);">Prescription</h4>
                            <p style="color: var(--primary-900); white-space: pre-line;">${item.prescription}</p>
                        </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
