<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Patient Login - MediConnect">
    <title>Patient Login - MediConnect</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body class="login-page">
    <div class="login-card">
        <!-- Back to Home -->
        <a href="/index.html"
            style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--gray-600); font-weight: 500; font-size: 14px; margin-bottom: var(--space-6); transition: color 0.3s ease;"
            onmouseover="this.style.color='var(--primary-600)'" onmouseout="this.style.color='var(--gray-600)'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Back to Home
        </a>

        <!-- Logo -->
        <div class="logo" style="justify-content: center; margin-bottom: var(--space-4);">
            <div class="logo-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path
                        d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
            </div>
            <span class="logo-text">Medi<span class="logo-highlight">Connect</span></span>
        </div>

        <h2 class="portal-title">Patient Portal</h2>
        <p class="portal-subtitle">Book appointments and track your medical history</p>

        <!-- LOGIN FORM -->

        <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <div class="form-input-icon">
                    <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                        <polyline points="22,6 12,13 2,6" />
                    </svg>
                    <input type="email" class="form-input" id="loginEmail" placeholder="you@example.com"
                        autocomplete="off" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="form-input-icon">
                    <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                    <input type="password" class="form-input" id="loginPassword" placeholder="••••••••"
                        autocomplete="new-password" required>
                </div>
            </div>

            <div class="login-extras">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    Remember me
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <div id="loginError" class="alert alert-error" style="display:none; margin-bottom:var(--space-4);">
            </div>
            <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Sign In</button>
        </form>
        <p style="text-align:center; margin-top: var(--space-4); font-size:0.85rem; color: var(--neutral-500);">
            Don't have an account? <a href="/patient/register.html"
                style="color:var(--primary-600); font-weight:600;">Register here</a>
        </p>
    </div>

    <!-- OTP FORM (Moved to register.html, but kept here if login requires OTP verification) -->
    <div id="otpForm" style="display:none; padding: 2rem;">
        <div style="text-align:center; margin-bottom: var(--space-6);">
            <div
                style="width:64px;height:64px; background:var(--primary-50); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto var(--space-4);">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--primary-600)"
                    stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                    <polyline points="22,6 12,13 2,6" />
                </svg>
            </div>
            <h2 style="font-size:1.15rem; font-weight:700; color:var(--neutral-800);">Two-Factor Authentication</h2>
            <p style="color:var(--neutral-500); font-size:0.875rem; margin-top:var(--space-2);">We sent a 6-digit
                OTP to <strong id="otpEmailDisplay"></strong></p>
        </div>
        <div class="form-group">
            <label class="form-label" style="text-align:center; display:block;">Enter OTP</label>
            <input type="text" id="otpInput" class="form-input" placeholder="000000" maxlength="6"
                style="text-align:center; font-size:1.8rem; font-weight:700; letter-spacing:8px;" required>
        </div>
        <div id="otpError" class="alert alert-error" style="display:none; margin-bottom:var(--space-4);"></div>
        <button onclick="handleVerifyOtp()" id="verifyBtn" class="btn btn-primary btn-block">Verify OTP</button>
    </div>

    <script src="/script.js"></script>
    <script>
        let currentEmail = '';
        let redirectAfterLogin = '';

        document.addEventListener('DOMContentLoaded', () => {
            const user = getUser();
            if (user && user.role === 'patient') {
                window.location.href = '/patient/dashboard.html';
                return;
            }
            const params = new URLSearchParams(window.location.search);
            if (params.get('tab') === 'register') {
                window.location.href = '/patient/register.html';
                return;
            }
            redirectAfterLogin = params.get('redirect') || '/patient/dashboard.html';
        });

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errEl = document.getElementById('loginError');
            errEl.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                const res = await fetch('/api/patients/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value,
                        password: document.getElementById('loginPassword').value
                    })
                });
                const data = await res.json();
                if (!res.ok) {
                    if (data.requiresOtp) {
                        showToast(data.message, 'info');
                        showOtpForm(data.email);
                        return;
                    }
                    errEl.textContent = data.error;
                    errEl.style.display = 'block';
                    return;
                }
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                showToast('Login successful!', 'success');
                setTimeout(() => window.location.href = redirectAfterLogin, 800);
            } catch (err) {
                errEl.textContent = 'Connection error. Please try again.';
                errEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }

        function showOtpForm(email) {
            currentEmail = email;
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('otpForm').style.display = 'block';
            document.getElementById('otpEmailDisplay').textContent = email;
            document.getElementById('otpInput').focus();
        }

        async function handleVerifyOtp() {
            const btn = document.getElementById('verifyBtn');
            const errEl = document.getElementById('otpError');
            const otp = document.getElementById('otpInput').value.trim();
            errEl.style.display = 'none';

            if (!otp || otp.length !== 6) {
                errEl.textContent = 'Please enter the 6-digit OTP.';
                errEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Verifying...';

            try {
                const res = await fetch('/api/patients/verify-login-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, otp })
                });
                const data = await res.json();
                if (!res.ok) {
                    errEl.textContent = data.error;
                    errEl.style.display = 'block';
                    return;
                }
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                showToast('Login successful!', 'success');
                setTimeout(() => window.location.href = redirectAfterLogin, 800);
            } catch (err) {
                errEl.textContent = 'Connection error. Please try again.';
                errEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Verify OTP';
            }
        }
    </script>
</body>

</html>
