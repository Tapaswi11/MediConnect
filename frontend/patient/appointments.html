<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments - Patient Portal - MediConnect</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="dashboard-layout">
    <aside class="dashboard-sidebar" id="patientSidebar">
        <div class="sidebar-logo"><div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div><span class="logo-text">Medi<span style="color:var(--primary-300);">Connect</span></span></div>
        <nav class="sidebar-nav">
            <div class="sidebar-section-title">Main</div>
            <a href="/index.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Back to Home</a>
            <a href="/patient/dashboard.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
            <a href="/patient/appointments.html" class="sidebar-link active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Check Appointments</a>
            <a href="/patient/appointment.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="8" y1="12" x2="16" y2="12"/></svg>Book Appointment</a>
            <a href="/patient/medical-history.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>Medical History</a>
            <div class="sidebar-section-title">Account</div>
            <a href="/patient/profile.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>My Profile</a>
            <a href="#" class="sidebar-link" onclick="logout()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout</a>
        </nav>
        <div class="sidebar-footer"><div class="sidebar-user"><div class="sidebar-user-avatar" id="sidebarAvatar">PT</div><div class="sidebar-user-info"><div class="sidebar-user-name" id="sidebarName">Patient</div><div class="sidebar-user-role">Patient</div></div></div></div>
    </aside>

    <main class="dashboard-main">
        <button class="sidebar-toggle-btn" onclick="document.getElementById('patientSidebar').classList.toggle('open')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <div class="dashboard-header">
            <div><h1 class="dashboard-title">My Appointments</h1><p class="dashboard-subtitle">Your complete appointment history.</p></div>
            <a href="/patient/book-appointment.html" class="btn btn-primary btn-sm">+ Book New</a>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h3 class="table-title">All Appointments</h3>
                <div class="table-filters"><input type="text" class="filter-input" id="searchFilter" placeholder="Search..." oninput="filterTable()"></div>
            </div>
            <div style="overflow-x:auto;">
                <table class="data-table">
                    <thead><tr><th>Apt. No.</th><th>Doctor</th><th>Specialization</th><th>Date</th><th>Time</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody id="appointmentsList"><tr><td colspan="7" class="text-center" style="padding:var(--space-8);"><div class="spinner" style="margin:0 auto;"></div></td></tr></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Details Modal -->
<div id="detailsModal" class="modal">
    <div class="modal-content" style="max-width:700px;">
        <div class="modal-header">
            <h3 class="modal-title">Appointment Details</h3>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div id="modalBody" style="padding:var(--space-6);"></div>
    </div>
</div>

<script src="/script.js"></script>
<script>
    let allAppointments = [];
    document.addEventListener('DOMContentLoaded', async () => {
        const user = getUser();
        if (!user || user.role !== 'patient') { window.location.href = '/patient/login.html'; return; }
        document.getElementById('sidebarName').textContent = user.full_name;
        document.getElementById('sidebarAvatar').textContent = getInitials(user.full_name);
        initDashboardSidebar();
        loadAppointments();
    });

    async function loadAppointments() {
        const token = localStorage.getItem('token');
        try {
            const res = await fetch('/api/patients/appointments', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            allAppointments = data.appointments || [];
            renderTable(allAppointments);
        } catch (e) { showToast('Failed to load appointments', 'error'); }
    }

    function renderTable(appointments) {
        const tbody = document.getElementById('appointmentsList');
        if (appointments.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center" style="padding:var(--space-8);color:var(--neutral-400);">No appointments found. <a href="/patient/book-appointment.html" style="color:var(--primary-600);font-weight:600;">Book one now!</a></td></tr>`;
            return;
        }
        tbody.innerHTML = appointments.map(apt => `
            <tr>
                <td><strong>${apt.appointment_number}</strong></td>
                <td>${apt.doctor_name || 'N/A'}</td>
                <td>${apt.specialization_name || 'N/A'}</td>
                <td>${formatDate(apt.appointment_date)}</td>
                <td>${apt.time_slot}</td>
                <td>${getStatusBadge(apt.status)}</td>
                <td>
                    <button class="action-btn" title="View Details" onclick="viewDetails(${apt.id})" style="background:var(--neutral-100);color:var(--neutral-700);">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    function filterTable() {
        const q = document.getElementById('searchFilter').value.toLowerCase();
        renderTable(allAppointments.filter(a =>
            (a.doctor_name || '').toLowerCase().includes(q) ||
            a.appointment_number.toLowerCase().includes(q)
        ));
    }
</script>
</body>
</html>
